<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>#WhoAreWe — 3D 展場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* CompoundWater 複水品牌色票 */
    --bg:#0a0a0a; --panel:#141414; --panel-2:#1c1c1c; --line:#2a2a2a;
    --yellow:#e9ff2e; --yellow-dim:#9aa816;
    --ink:#f2f2ea; --dim:#8a8a83;
    --radius:2px;              /* 銳角風格，不要改圓 */
    --gold:var(--yellow);      /* 舊名沿用 */
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --display:"Space Grotesk","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas{display:block}
  #app{position:fixed;inset:0}

  /* ---------- 載入 ---------- */
  #loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s}
  #loader h1{font-family:var(--display);font-size:clamp(28px,6vw,54px);letter-spacing:.06em;font-weight:500}
  #loader h1 b{color:var(--yellow);font-weight:700}
  #bar{width:min(340px,70vw);height:2px;background:var(--line);overflow:hidden}
  #bar i{display:block;height:100%;width:0%;background:var(--yellow);transition:width .3s;
    box-shadow:0 0 12px rgba(233,255,46,.55)}
  #pct{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--dim)}

  /* ---------- 序幕 ---------- */
  #intro{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 42%,#151505 0%,var(--bg) 62%);text-align:center;padding:24px}
  #intro .box{max-width:640px}
  #intro .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--yellow);margin-bottom:18px}
  #intro h2{font-family:var(--display);font-size:clamp(32px,7.5vw,64px);font-weight:500;letter-spacing:.01em;line-height:1.1}
  #intro h2 b{color:var(--yellow)}
  #intro h2 b{font-weight:700}
  #intro p{margin-top:22px;font-size:15px;line-height:2;color:var(--dim)}
  #intro .credit{font-family:var(--mono);margin-top:18px;font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .btn{margin-top:32px;display:inline-block;border:1px solid var(--yellow);color:var(--yellow);
    background:transparent;padding:13px 34px;font-size:13px;letter-spacing:.28em;cursor:pointer;
    transition:.25s;font-family:var(--mono);font-weight:500;border-radius:var(--radius)}
  .btn:hover{background:var(--yellow);color:var(--bg);box-shadow:0 0 24px rgba(233,255,46,.3)}
  .hint{font-family:var(--mono);margin-top:26px;font-size:11px;letter-spacing:.14em;
    color:#5c5c56;line-height:2}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
  #brand{position:absolute;top:20px;left:24px;font-family:var(--mono);font-size:11px;
    letter-spacing:.3em;color:var(--dim)}
  #brand b{color:var(--yellow)}
  #tools{position:absolute;top:16px;right:20px;display:flex;gap:8px;pointer-events:auto}
  .tool{border:1px solid var(--line);background:rgba(20,20,20,.65);color:#b5b5ac;font-size:11px;
    letter-spacing:.18em;padding:9px 15px;cursor:pointer;font-family:var(--mono);transition:.2s;
    backdrop-filter:blur(6px);border-radius:var(--radius)}
  .tool:hover{border-color:var(--yellow);color:var(--yellow)}
  .tool.on{border-color:var(--yellow);color:var(--bg);background:var(--yellow)}
  #crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:rgba(255,255,255,.55);transition:.2s}
  #crosshair.hot{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;background:transparent;
    border:1px solid var(--yellow);box-shadow:0 0 10px rgba(233,255,46,.45)}
  #tip{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--mono);
    font-size:11px;letter-spacing:.18em;color:#5c5c56;white-space:nowrap}

  /* ---------- 作品說明 ---------- */
  #card{position:fixed;z-index:30;right:0;top:0;height:100%;width:min(380px,84vw);
    background:linear-gradient(180deg,rgba(20,20,20,.95),rgba(10,10,10,.97));
    border-left:1px solid var(--line);backdrop-filter:blur(14px);
    transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);
    padding:44px 34px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
  #card.show{transform:none}
  #card .no{font-family:var(--mono);font-size:11px;letter-spacing:.35em;color:var(--yellow)}
  #card h3{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.01em}
  #card .meta{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;
    line-height:2.2;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
  #card p{font-size:14px;line-height:2.1;color:#b5b5ac}
  #card .series{font-size:13px;line-height:2.1;color:#7a7a73;
    border-top:1px solid var(--line);padding-top:16px;white-space:pre-line}
  #card .thumb{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);
    border-radius:var(--radius)}
  #card .nav{display:flex;gap:10px;margin-top:auto;padding-top:20px}
  #card .nav button{flex:1;border:1px solid var(--line);background:none;color:#b5b5ac;padding:12px;
    cursor:pointer;font-size:12px;letter-spacing:.16em;font-family:var(--mono);transition:.2s;
    border-radius:var(--radius)}
  #card .nav button:hover{border-color:var(--yellow);color:var(--yellow)}
  #card .close{position:absolute;top:14px;right:18px;font-size:22px;color:#5c5c56;cursor:pointer;
    background:none;border:none;font-family:inherit}
  #card .close:hover{color:var(--yellow)}

  /* ---------- 手機搖桿 ---------- */
  #stick{position:fixed;left:22px;bottom:22px;width:108px;height:108px;border-radius:50%;
    border:1px solid var(--line);background:rgba(20,20,20,.4);z-index:25;display:none;touch-action:none}
  #stick i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;
    border-radius:50%;background:rgba(233,255,46,.5)}
  @media (max-width:820px){ #tip{display:none} #brand{font-size:9px} }
</style>
</head>

</div>

<div id="hud">

  <div id="tools">
    <button class="tool" id="btnTour">自動導覽</button>
    <button class="tool" id="btnList">作品索引</button>
  </div>
  <div id="crosshair"></div>
  <div id="tip">WASD 移動 · 滑鼠轉向 · 對準畫作點擊</div>
</div>

<div id="card">
  <button class="close" id="cardClose">×</button>

  <div class="meta" id="cMeta"></div>

  <p class="series" id="cSeries"></p>
  <div class="nav">
    <button id="cPrev">← 上一件</button>
    <button id="cNext">下一件 →</button>
  </div>
</div>

<div id="stick"><i></i></div>

scene.fog = new THREE.Fog(0x0a0a0a, 26, 82);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 1.65, 27);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
app.appendChild(renderer.domElement);

/* ---------------- 材質貼圖（程序生成） ---------------- */
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(rep) t.repeat.set(rep[0],rep[1]);
  return t;
}
// 磨石子地板
const floorTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#141317'; g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){
    const x=Math.random()*w,y=Math.random()*h,r=Math.random()*2.6+.4;
    g.fillStyle=`rgba(${180+Math.random()*60},${172+Math.random()*60},${160+Math.random()*60},${Math.random()*.12+.03})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const grd=g.createLinearGradient(0,0,w,h);
  grd.addColorStop(0,'rgba(255,255,255,.03)'); grd.addColorStop(1,'rgba(0,0,0,.12)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
},[14,22]);
// 微紋理牆面

function buildStatue(loader){
  const g = new THREE.Group();

  inlay.rotation.x = -Math.PI/2; inlay.position.y = .012; g.add(inlay);

  const base = new THREE.Mesh(new THREE.CylinderGeometry(STATUE.baseR, STATUE.baseR+.12, STATUE.baseH, 64), stone);
  base.position.y = STATUE.baseH/2; g.add(base);
  const step = new THREE.Mesh(new THREE.CylinderGeometry(STATUE.baseR-.45, STATUE.baseR-.3, .34, 64), stone);
  step.position.y = STATUE.baseH + .17; g.add(step);

  /* ---- 胸像：立體量體 ＋ 正面包上原圖 ---- */
  const y0 = STATUE.baseH + .34;

  const add = (geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); bust.add(m); return m;
  };

  const HY = 2.05;                      // 頭部中心（相對石座頂）

  const hatMass = add(new THREE.SphereGeometry(1.255, 48, 24, 0, Math.PI*2, 0, 1.02),
                      M(C.hat, {emissive:0x080808}), 0, HY, -.02);
  hatMass.rotation.x = -.08;

  // 正面：把原圖包在弧面上（水平方向彎，跟臉一樣）

  const SW = 2.62, R = 1.30;            // 弧面寬度與半徑
  const face = add(

    new THREE.MeshLambertMaterial({map:headTex, transparent:true, alphaTest:.35,

    0, HY, 0);

  // 胸前的 Hannah
  const chestText = new THREE.Mesh(
    new THREE.CylinderGeometry(1.40, 1.40, .38, 40, 1, true, -0.70, 1.40),
    new THREE.MeshBasicMaterial({
      transparent:true, side:THREE.DoubleSide, depthWrite:false,
      map: canvasTex(640,160,(c,w,h)=>{

        c.font='700 88px "Noto Sans TC","PingFang TC",sans-serif';
        c.fillText('Hannah', w/2, h/2+32);
      })
    }));
  chestText.position.set(0, .42, 0); bust.add(chestText);

  /* ---- 石座銘牌 ---- */
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.7, .58), new THREE.MeshBasicMaterial({
    map: canvasTex(512,176,(c,w,h)=>{
      c.fillStyle='#1b1a1e'; c.fillRect(0,0,w,h);

      c.fillText('@hannah.huahua', w/2, 126);

  plate.position.set(0, STATUE.baseH*.55, STATUE.baseR+.045); g.add(plate);

  /* ---- 打光 ---- */
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(9, 9),

const stick = document.getElementById('stick'), knob = stick.querySelector('i');
if(matchMedia('(pointer:coarse)').matches){
  stick.style.display='block';
  document.getElementById('tip').style.display='none';
  let sid=null;
  stick.addEventListener('touchstart', e=>{ sid=e.changedTouches[0].identifier; e.preventDefault(); },{passive:false});
  stick.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){ if(t.identifier!==sid) continue;
      const r=stick.getBoundingClientRect();
      let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
      const m=Math.min(Math.hypot(dx,dy),44), a=Math.atan2(dy,dx);
      dx=Math.cos(a)*m; dy=Math.sin(a)*m;
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      stickVec={x:dx/44, y:dy/44};
    }
    e.preventDefault();
  },{passive:false});
  const end=()=>{ sid=null; stickVec={x:0,y:0}; knob.style.transform=''; };
  stick.addEventListener('touchend',end); stick.addEventListener('touchcancel',end);

  renderer.domElement.addEventListener('touchstart', e=>{
    const t=e.changedTouches[0]; touchLook={id:t.identifier,x:t.clientX,y:t.clientY,moved:0};
  });
  renderer.domElement.addEventListener('touchmove', e=>{
    if(!touchLook||focus) return;
    for(const t of e.changedTouches){ if(t.identifier!==touchLook.id) continue;
      const dx=t.clientX-touchLook.x, dy=t.clientY-touchLook.y;
      touchLook.moved += Math.abs(dx)+Math.abs(dy);
      player.yaw -= dx*.005; player.pitch = Math.max(-1.2,Math.min(1.2, player.pitch - dy*.005));
      touchLook.x=t.clientX; touchLook.y=t.clientY;
    }
  });
  renderer.domElement.addEventListener('touchend', e=>{
    if(touchLook && touchLook.moved < 12) pickAt(touchLook.x, touchLook.y);
    touchLook=null;
  });
}

/* ---------------- 碰撞 ---------------- */
function collide(p){
  const r = .55;
  p.x = Math.max(-HX+r+.3, Math.min(HX-r-.3, p.x));
  p.z = Math.max(-HZ+r+.3, Math.min(HZ-r-.3, p.z));
  const dc = Math.hypot(p.x, p.z), R = STATUE.baseR + .7 + r;
  if(dc < R){ const k = R / (dc || 1e-6); p.x *= k; p.z *= k; }
  for(const pz of PARTS){
    const dz = p.z - pz;
    if(Math.abs(dz) < PT/2 + r && Math.abs(p.x) < PW/2 + r){
      // 推出：比較 x / z 的穿透深度
      const penZ = (PT/2 + r) - Math.abs(dz);
      const penX = (PW/2 + r) - Math.abs(p.x);
      if(penZ < penX) p.z = pz + Math.sign(dz||1)*(PT/2 + r);
      else p.x = Math.sign(p.x||1)*(PW/2 + r);
    }
  }
  return p;
}

let focus = null, camAnim = null;

function focusOn(id){
  const a = artworks.find(w=>w.id===id); if(!a) return;
  focus = a;
  const target = new THREE.Vector3(a.slot.x, a.slot.y, a.slot.z)
    .add(a.fwd.clone().multiplyScalar(a.dist || 3.8));
  target.y = a.slot.y - .05;
  let look = Math.atan2(a.fwd.x, a.fwd.z);
  // 說明面板佔據右側時，把畫作往畫面左邊挪，避免被蓋住
  const panelW = Math.min(380, innerWidth*0.84);
  if(innerWidth > 820){
    const hfov = 2*Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect);
    look -= (panelW/innerWidth)/2 * hfov;
  }
  camAnim = { from:player.pos.clone(), to:target, fy:player.yaw,
              ty:shortAngle(player.yaw, look), fp:player.pitch, tp:0, t:0 };
  showCard(a);
  if(document.pointerLockElement) document.exitPointerLock();
}
function shortAngle(from, to){
  let d = (to - from) % (Math.PI*2);
  if(d >  Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return from + d;
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(cx, cy){
  ndc.x = (cx/innerWidth)*2 - 1; ndc.y = -(cy/innerHeight)*2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables)[0];
  if(hit) focusOn(hit.object.userData.id);
}
function lockPointer(){
  try{ const r = renderer.domElement.requestPointerLock(); if(r && r.catch) r.catch(()=>{}); }catch(_){}
}
function onClick(e){
  if(focus){ exitFocus(); return; }
  if(locked){
    ndc.set(0,0); ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables)[0];
    if(hit && hit.distance < 16) focusOn(hit.object.userData.id);
    return;
  }
  if(!matchMedia('(pointer:coarse)').matches) lockPointer();
}

function animate(){

    const e = 1 - Math.pow(1 - camAnim.t, 3);
    player.pos.lerpVectors(camAnim.from, camAnim.to, e);
    player.yaw   = camAnim.fy + (camAnim.ty - camAnim.fy)*e;
    player.pitch = camAnim.fp + (camAnim.tp - camAnim.fp)*e;
    if(camAnim.t >= 1) camAnim = null;
  } else if(!focus){
    const speed = (keys.ShiftLeft||keys.ShiftRight ? 9.5 : 5.2);
    let f = 0, s = 0;
    if(keys.KeyW||keys.ArrowUp)    f += 1;
    if(keys.KeyS||keys.ArrowDown)  f -= 1;
    if(keys.KeyA||keys.ArrowLeft)  s -= 1;
    if(keys.KeyD||keys.ArrowRight) s += 1;
    f -= stickVec.y; s += stickVec.x;
    const len = Math.hypot(f,s);
    if(len > 0){
      f/=len; s/=len;
      const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
      player.vel.x += (-sin*f + cos*s) * speed;
      player.vel.z += (-cos*f - sin*s) * speed;
      bob += dt * speed * 1.5;
    }
    player.vel.multiplyScalar(Math.pow(.0016, dt));
    player.pos.x += player.vel.x * dt;
    player.pos.z += player.vel.z * dt;
    collide(player.pos);
    player.pos.y = 1.65 + Math.sin(bob)*.022;
  }

  camera.position.copy(player.pos);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  // 準星命中提示
  if(!focus && locked){
    ndc.set(0,0); ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables)[0];
    cross.classList.toggle('hot', !!(hit && hit.distance < 16));
  } else cross.classList.remove('hot');

  // 自動導覽
  if(tour && !camAnim){
    tourT += dt;
    if(tourT > 5.5){ tourT = 0; tourIdx = tourIdx < TOTAL ? tourIdx+1 : 1; focusOn(tourIdx); }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
